name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Check verification left the checkout unchanged
        run: |
          git status --porcelain --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"

  browser:
    name: Browser smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Built Worker request-body regression
        run: npm run test:worker
        timeout-minutes: 8
      - name: Check no Worker process remains
        if: always()
        run: |
          if pgrep -a workerd || pgrep -af 'wrangler\.js'; then
            echo "A Worker process outlived the request-body regression."
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CI: true
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/coin-radar-playwright
      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces
          path: ${{ runner.temp }}/coin-radar-playwright
          if-no-files-found: ignore
          retention-days: 7
